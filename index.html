<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#15123C">
  <title>Loyalty cards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main id="lock" class="view lock">
    <h1 class="lock-title">Loyalty cards</h1>
    <p id="lock-hint" class="lock-hint" role="status">Enter your PIN</p>
    <div id="dots" class="dots" aria-hidden="true"></div>
    <div id="keypad" class="keypad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <span></span>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="del" class="key-del" aria-label="Delete last digit">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7Z M12 9.5l5 5 M17 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </main>

  <main id="wallet" class="view wallet" hidden>
    <header class="bar">
      <h1 class="bar-title">Cards</h1>
      <button type="button" id="lock-now" class="bar-button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Lock
      </button>
    </header>
    <div id="grid" class="grid"></div>
  </main>

  <main id="card" class="view detail" hidden>
    <header class="bar">
      <button type="button" id="back" class="bar-button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Cards
      </button>
    </header>
    <article id="pass" class="pass">
      <h1 id="pass-name" class="pass-name" tabindex="-1"></h1>
      <div class="pass-body">
        <div id="code" class="code"></div>
        <p id="pass-number" class="pass-number"></p>
        <button type="button" id="copy" class="copy">Copy number</button>
      </div>
    </article>
  </main>

  <noscript><p class="noscript">This site needs JavaScript to unlock the cards.</p></noscript>

  <script src="vendor/JsBarcode.all.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="vault.js"></script>
  <script src="app.js"></script>
</body>
</html>
